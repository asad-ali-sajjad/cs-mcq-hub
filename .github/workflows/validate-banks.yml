name: Validate MCQ Banks

on:
  push:
    paths:
      - "data/**"
      - "assets/js/subjects-data.js"
      - "assets/js/config.js"
      - "scripts/validate-banks.js"
      - ".github/workflows/validate-banks.yml"
  pull_request:
    paths:
      - "data/**"
      - "assets/js/subjects-data.js"
      - "assets/js/config.js"
      - "scripts/validate-banks.js"
      - ".github/workflows/validate-banks.yml"
  workflow_dispatch:

jobs:
  validate:
    name: Validate Catalog & Question Banks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run MCQ bank validator
        run: node scripts/validate-banks.js