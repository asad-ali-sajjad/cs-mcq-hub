<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-config-title-format="Subject Status — {brand.name}">Subject Status</title>
  <meta name="description" data-config-meta-description="brand.metaDescription" content="Subject availability and upcoming MCQ bank status.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233b5bdb'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='28' fill='%23ffffff'%3ECS%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/coming-soon.css">
</head>
<body>

  <!-- Ambient Background Blobs -->
  <div class="blob blob1" aria-hidden="true"></div>
  <div class="blob blob2" aria-hidden="true"></div>
  <div class="blob blob3" aria-hidden="true"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo" data-config-logo></a>
      <button type="button" class="theme-btn" id="themeBtn" aria-label="Switch to dark mode" aria-pressed="false">🌙 Dark</button>
    </div>
  </header>

  <!-- Main Status Card -->
  <main class="cs-main">
    <section class="cs-card" aria-labelledby="cs-title">
      <div class="cs-top-meta">
        <span class="cs-icon" id="cs-icon" aria-hidden="true">🚧</span>
        <span class="cs-badge" id="cs-badge">In Preparation</span>
      </div>

      <h1 id="cs-title">Subject Bank Coming Soon</h1>
      <p class="cs-desc" id="cs-desc">
        This question bank is currently being compiled and verified. Browse our available subjects to start practicing right away.
      </p>

      <div class="cs-actions" id="cs-actions">
        <a href="index.html" class="btn btn-primary">← Browse All Subjects</a>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-bottom">
      <span><span data-config-text="brand.copyrightLine">Crafted for focused exam preparation</span> • <strong data-config-text="brand.name"></strong></span>
      <span>Open-source static study workspace</span>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/subjects-data.js"></script>
  <script src="assets/js/coming-soon.js"></script>
</body>
</html>
